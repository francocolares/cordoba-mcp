name: deploy-cloudflare

# Despliega el Worker (landing de Astro + MCP en /mcp) con los datos embebidos.
# Lo dispara: un push a main, la Action del scraper cuando commitea datos nuevos,
# o a mano con workflow_dispatch.
on:
  push:
    branches: [main]
    # Todo lo que puede cambiar el bundle o el resultado del pipeline. `data/`
    # NO está: los datos viven en R2 y los sube el workflow que scrapea
    # (sync-r2.mjs), así que un dato nuevo ya no necesita publicar el Worker.
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "vitest.config.ts"
      - "tests/**"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Sin `secrets:` declarados a propósito: las credenciales de Cloudflare viven
  # en el environment `prod`, que el job resuelve por su cuenta (declarar un
  # secret como required acá obligaría a tenerlo también a nivel repo).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID salen de este environment.
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la toma de `packageManager` en package.json
      # (pnpm@11.26.0). Especificarla acá también hace fallar la action con
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      # Compila core -> web -> worker (valida el bundle con un deploy --dry-run).
      - run: pnpm build

      # El Worker declara el binding de R2, así que el bucket tiene que existir
      # antes del deploy. Es idempotente y, con los datos de `data/` ya en el
      # repo, deja el bucket consistente con el código que se publica. Publicar
      # datos frescos sigue siendo trabajo del scrape (ver sync-data.yml).
      - name: Asegurar el bucket de R2 y sus datos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/worker/scripts/sync-r2.mjs --ensure-bucket

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy

      # `deployment-url` de wrangler-action no siempre es una URL usable: con un
      # Custom Domain devuelve "cordobamcp.com (custom domain)", sin esquema y con
      # el sufijo literal. Lo normalizamos y reintentamos, porque un certificado
      # recién emitido puede tardar un rato en responder.
      - name: Smoke test del MCP desplegado
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          RAW="${PROD_URL:-${URL:-}}"
          BASE=$(printf '%s' "$RAW" | sed -E 's/[[:space:]]*\(custom domain\)[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$BASE" ]; then
            echo "::warning::no hay URL para verificar (deployment-url vacío y PROD_URL sin definir)"
            exit 0
          fi
          case "$BASE" in
            http://* | https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          echo "Verificando $BASE"
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 "$BASE/health" | tee /dev/stderr | grep -q '"ok": true'; then
              echo "/health OK en el intento $i"
              node apps/worker/smoke.mjs "$BASE/mcp"
              echo "SMOKE_URL=$BASE" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "intento $i sin respuesta; reintento en 10s"
            sleep 10
          done
          echo "::error::$BASE no respondió tras 3 minutos. Si es el primer deploy con dominio propio, puede ser el certificado del Custom Domain todavía emitiéndose: reintentá el job."
          exit 1

      - name: Resumen
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          {
            echo "### Deploy a Cloudflare"
            echo
            echo "- Desplegado: ${URL:-(no informado)}"
            echo "- Verificado: ${SMOKE_URL:-(no verificado)}"
            echo "- MCP: ${SMOKE_URL:+$SMOKE_URL/mcp}"
            echo "- Datos: en R2 (los frescos los sube el workflow de scrape)"
          } >> "$GITHUB_STEP_SUMMARY"
