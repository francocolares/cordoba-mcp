name: scrape-agenda

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 hora de Córdoba (UTC-3); minuto no redondo a propósito
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape-agenda
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la toma de `packageManager` en package.json
      # (pnpm@11.26.0). Especificarla acá también hace fallar la action con
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - id: validate
        run: node apps/scraper/dist/index.js validate | tee validation.json

      - name: Abrir issue si la validación falló
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('validation.json')
              ? fs.readFileSync('validation.json', 'utf8')
              : 'sin salida';
            const title = 'La fuente de la agenda cambió o falló la validación';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper-alert',
            });
            if (!open.data.some((i) => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['scraper-alert'],
                body: '```json\n' + body + '\n```',
              });
            }

      # `run` y no `scrape`: revalida y deja el veredicto dentro de status.json.
      # `scrape` a secas lo escribe en null, porque la validación de arriba
      # ocurrió en otro proceso.
      - run: node apps/scraper/dist/index.js run

      - name: Commitear data/
        id: commit
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en data/."
          else
            git commit -m "data: agenda $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Los datos viven en R2, no en el bundle del Worker: subirlos es lo que los
  # publica. Por eso acá no se llama al deploy, que ahora es sólo para código.
  publicar:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID salen de este environment.
    environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # El job anterior commiteó y pusheó: hay que traer ese commit, no el que
        # disparó el workflow.
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Subir los datos a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/worker/scripts/sync-r2.mjs
      - name: Verificar que el MCP ya sirve el dato nuevo
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          BASE="${PROD_URL:-https://cordobamcp.com}"
          case "$BASE" in http://*|https://*) ;; *) BASE="https://$BASE" ;; esac
          # El manifest se cachea 60s por isolate: reintentamos un rato.
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$BASE/health" | jq -e '.data_source.error == null and (.collections | all(.available))' > /dev/null; then
              echo "$BASE sirviendo datos de R2 (intento $i)"
              exit 0
            fi
            echo "intento $i: todavía no; reintento en 15s"
            sleep 15
          done
          echo "::error::$BASE no está sirviendo los datos de R2"
          exit 1
