packages:
  - apps/*
  - packages/*

# pnpm 11: los paquetes con postinstall tienen que estar aprobados explícitamente
# o `pnpm install` falla con ERR_PNPM_IGNORED_BUILDS.
#   esbuild  -> lo usan vitest y astro
#   sharp    -> optimización de imágenes de astro
#   workerd  -> el runtime de wrangler
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
